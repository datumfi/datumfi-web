<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#091221">
<title>Datum FI — Cinematic Transition Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-navy: #091221;
    --teal-mid: #5DCAA5;
    --gold: #C9A84C;
    --danger-red: #e24b4a;
    --white: #ffffff;
    --muted: rgba(255,255,255,0.4);
    --grid-line: rgba(100, 180, 255, 0.05);
    --font-serif: 'Fraunces', serif;
    --font-mono: 'DM Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-navy);
    color: var(--white);
    font-family: var(--font-serif);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* --- DEMO TRIGGER BUTTON --- */
  .trigger-btn {
    background: var(--teal-mid);
    color: #000;
    border: none;
    font-family: var(--font-mono);
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    padding: 20px 40px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 700;
    box-shadow: 0 10px 30px rgba(93, 202, 165, 0.3);
    transition: all 0.3s ease;
    z-index: 10;
  }
  .trigger-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 40px rgba(93, 202, 165, 0.5);
  }

  /* =========================================
     CINEMATIC OVERLAY ENGINE
     ========================================= */
  #cinematic-overlay { 
    position: fixed; 
    top: 0; left: 0; 
    width: 100vw; height: 100vh; 
    background-color: var(--bg-navy); 
    background-image: 
      linear-gradient(var(--grid-line) 1px, transparent 1px), 
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px); 
    background-size: 40px 40px; 
    z-index: 99999; 
    display: flex; 
    align-items: center; 
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }
  #cinematic-overlay.active { 
    opacity: 1; 
    pointer-events: all; 
  }

  .c-layout {
    display: flex;
    width: 100%;
    max-width: 1100px;
    height: 500px;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
  }

  /* --- LEFT: TELEMETRY TERMINAL --- */
  .c-terminal {
    width: 400px; 
    font-family: var(--font-mono); 
    font-size: 12px;
    color: var(--teal-mid); 
    text-transform: uppercase; 
    letter-spacing: 0.15em;
    line-height: 2.8;
  }
  
  .c-log-line { 
    opacity: 0; 
    transform: translateX(-15px); 
    transition: opacity 0.2s ease-out, transform 0.2s ease-out; 
  }
  .c-log-line.show { 
    opacity: 1; 
    transform: translateX(0); 
  }

  /* --- RIGHT: GEOMETRIC STAGE --- */
  .c-stage {
    width: 550px; 
    height: 450px; 
    position: relative;
  }

  /* The Detailed Architectural SVG Wireframe */
  .c-estate-svg {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 500px;
    height: 380px;
    opacity: 0;
    transition: opacity 1s ease, transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
    overflow: visible;
  }
  .c-estate-svg.show { opacity: 1; }
  
  /* Dimming after shock */
  .c-estate-svg.dim { opacity: 0.15; transform: translate(-50%, -50%) scale(0.95); }
  
  /* Thermodynamic Shock Flash (Targets ALL SVG elements) */
  .c-estate-svg.shocked line, 
  .c-estate-svg.shocked rect, 
  .c-estate-svg.shocked path, 
  .c-estate-svg.shocked circle {
    stroke: var(--danger-red) !important;
    transition: stroke 0.1s ease;
  }

  /* Drawing Animation for ALL SVG structural lines */
  .c-estate-svg line, 
  .c-estate-svg rect, 
  .c-estate-svg path, 
  .c-estate-svg circle {
    stroke-dasharray: 2000;
    stroke-dashoffset: 2000;
    transition: stroke-dashoffset 2.5s cubic-bezier(0.25, 1, 0.5, 1), stroke 0.4s;
  }
  .c-estate-svg.show line, 
  .c-estate-svg.show rect, 
  .c-estate-svg.show path, 
  .c-estate-svg.show circle {
    stroke-dashoffset: 0;
  }

  /* The Glowing V-Scan Beam */
  .c-scanner {
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    width: 550px;
    height: 3px;
    background: var(--teal-mid);
    box-shadow: 0 0 30px 10px rgba(93, 202, 165, 0.4);
    opacity: 0;
    z-index: 10;
  }
  .c-scanner.scan {
    opacity: 1;
    transition: top 1.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s;
    top: 420px; /* drops all the way through */
  }

  /* Thermodynamic Shockwave Circle */
  .c-shockwave {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 20px;
    height: 20px;
    background: transparent;
    border: 2px solid var(--danger-red);
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(0);
    opacity: 0;
    z-index: 15;
    pointer-events: none;
  }
  .c-shockwave.fire {
    animation: shockwaveAnim 0.8s ease-out forwards;
  }
  @keyframes shockwaveAnim {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 1; border-width: 20px; }
    100% { transform: translate(-50%, -50%) scale(30); opacity: 0; border-width: 1px; }
  }

  /* --- RANGE LINES OVERLAY --- */
  .c-range-container {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 20;
  }

  .c-line-wrapper {
    position: absolute;
    left: 0;
    width: 100%;
    height: 30px;
    display: flex;
    align-items: center;
  }

  /* Centered Vertical Positioning for the 3 Lines */
  .c-line-wrapper.ceil { top: 70px; }
  .c-line-wrapper.datum { top: 210px; }
  .c-line-wrapper.floor { top: 350px; }

  .c-line-track {
    flex: 1;
    height: 2px;
    position: relative;
    overflow: hidden;
  }
  
  .c-line-fill {
    position: absolute;
    top: 0; left: 0; height: 100%; width: 0%;
    transition: width 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .c-line-wrapper.ceil .c-line-fill { background: var(--gold); }
  .c-line-wrapper.datum .c-line-fill { background: var(--teal-mid); }
  .c-line-wrapper.floor .c-line-fill { background: var(--danger-red); }

  .c-line-wrapper.expand .c-line-fill { width: 100%; }

  .c-node {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--bg-navy);
    border: 2px solid;
    margin: 0 15px;
    opacity: 0;
    transform: scale(0);
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .c-line-wrapper.ceil .c-node { border-color: var(--gold); }
  .c-line-wrapper.datum .c-node { border-color: var(--teal-mid); background: var(--teal-mid); }
  .c-line-wrapper.floor .c-node { border-color: var(--danger-red); }
  
  .c-line-wrapper.expand .c-node { opacity: 1; transform: scale(1); }

  .c-label {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 0.15em;
    opacity: 0;
    transform: translateX(-15px);
    transition: all 0.4s ease;
  }
  .c-line-wrapper.ceil .c-label { color: var(--gold); }
  .c-line-wrapper.datum .c-label { color: var(--teal-mid); }
  .c-line-wrapper.floor .c-label { color: var(--danger-red); }
  
  .c-line-wrapper.expand .c-label { opacity: 1; transform: translateX(0); }

  /* Demo Reset Button */
  .c-demo-reset {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    background: transparent;
    border: 1px solid var(--muted);
    color: var(--white);
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 10px 20px;
    border-radius: 4px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: 0.3s;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .c-demo-reset.show { opacity: 1; pointer-events: all; }
  .c-demo-reset:hover { border-color: var(--white); }

  @media (max-width: 900px) {
    .c-layout { flex-direction: column; justify-content: center; height: 100vh; padding: 20px;}
    .c-terminal { width: 100%; margin-bottom: 40px; text-align: center; }
    .c-stage { width: 100%; max-width: 400px; height: 350px; }
    .c-estate-svg { width: 300px; height: 250px; }
  }

</style>
</head>

  <script>
    function startCinematicReveal() {
      // 0. Show Overlay
      const overlay = document.getElementById('cinematic-overlay');
      overlay.classList.add('active');

      // 1. Precise Timeline Logs
      setTimeout(() => document.getElementById('log-1').classList.add('show'), 300);
      setTimeout(() => document.getElementById('log-2').classList.add('show'), 700);
      setTimeout(() => document.getElementById('log-3').classList.add('show'), 1100);
      setTimeout(() => document.getElementById('log-4').classList.add('show'), 1500);

      // 2. Fade in and Draw Estate
      setTimeout(() => {
          document.getElementById('c-estate').classList.add('show');
          document.getElementById('c-estate-text').style.opacity = "1";
      }, 800);

      // 3. Drop the V-Scan Beam
      setTimeout(() => {
          document.getElementById('c-scanner').classList.add('scan');
      }, 1800);

      // 4. Scanner finishes, fades out
      setTimeout(() => {
          document.getElementById('c-scanner').style.opacity = '0';
      }, 3400);

      // 5. THERMODYNAMIC SHOCK
      setTimeout(() => {
          document.getElementById('log-5').classList.add('show'); // Apply shock log
          document.getElementById('c-shockwave').classList.add('fire'); // Radiate red circle
          document.getElementById('c-estate').classList.add('shocked'); // Flash building red
          
          // Instantly recover building to dim state after flash
          setTimeout(() => {
              document.getElementById('c-estate').classList.remove('shocked');
              document.getElementById('c-estate').classList.add('dim');
              document.getElementById('c-estate-text').style.opacity = "0";
          }, 400);
      }, 3500);

      // 6. Mapping Boundaries
      setTimeout(() => {
          document.getElementById('log-6').classList.add('show');
      }, 4200);

      // 7. Lock in Range Lines sequentially
      setTimeout(() => document.getElementById('cw-ceil').classList.add('expand'), 4300);
      setTimeout(() => document.getElementById('cw-datum').classList.add('expand'), 4600);
      setTimeout(() => document.getElementById('cw-floor').classList.add('expand'), 4900);

      // 8. Datum Locked / Show Redirect
      setTimeout(() => {
          document.getElementById('log-7').classList.add('show');
          document.getElementById('demo-reset').classList.add('show');
      }, 5600);
    }

    function resetDemo() {
        // Strip all animation classes to reset state
        document.getElementById('cinematic-overlay').classList.remove('active');
        document.getElementById('c-estate').classList.remove('show', 'dim', 'shocked');
        document.getElementById('c-estate-text').style.opacity = "0";
        
        const scanner = document.getElementById('c-scanner');
        scanner.classList.remove('scan');
        scanner.style.opacity = '';
        
        document.getElementById('c-shockwave').classList.remove('fire');

        [1, 2, 3, 4, 5, 6, 7].forEach(i => document.getElementById('log-' + i).classList.remove('show'));
        
        ['ceil', 'datum', 'floor'].forEach(id => {
            document.getElementById('cw-' + id).classList.remove('expand');
        });

        document.getElementById('demo-reset').classList.remove('show');
    }
  </script>
</body>
</html>

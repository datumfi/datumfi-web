<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#091221">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://cloudflareinsights.com;">
<title>Datum FI — Establish Origin</title>
<meta name="description" content="Create or access your Datum FI Studio account.">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Datum FI">
<meta property="og:title" content="Datum FI — Establish Origin">
<meta property="og:description" content="Create or access your Datum FI Studio account.">
<meta property="og:image" content="/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Datum FI — Establish Origin">
<meta name="twitter:image" content="/og-image.png">
<script>
  (function() {
    var params = new URLSearchParams(window.location.search);
    var mode = params.get('mode');
    var returnTo = params.get('returnTo');
    var dest = mode === 'sign-up'
      ? 'https://accounts.datumfi.com/sign-up'
      : 'https://accounts.datumfi.com/sign-in';
    var redirectBase = returnTo
      ? ('https://datumfi.com' + returnTo)
      : 'https://datumfi.com/my-account.html';
    window.location.replace(dest + '?redirect_url=' + encodeURIComponent(redirectBase));
  })();
</script>
<style>
  body { background-color: #091221; min-height: 100vh; display: flex; align-items: center; justify-content: center; color-scheme: dark; }
  .loading-ring { width: 32px; height: 32px; border: 2px solid rgba(93,202,165,0.15); border-top-color: #5DCAA5; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="loading-ring"></div>
</body>
</html>
